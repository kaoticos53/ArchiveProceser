name: Continuous Integration (Build & Test)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # -------------------------------------------------------------------------
  # 1. Compilación, Pruebas y Cobertura en Windows
  # -------------------------------------------------------------------------
  build-and-test:
    name: 🧪 Compilar y Ejecutar Pruebas (Windows)
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 📦 Restaurar dependencias
        run: dotnet restore FileFlow.slnx

      - name: 🏗️ Compilar solución
        run: dotnet build FileFlow.slnx -c Release --no-restore

      - name: 🧪 Ejecutar suite de pruebas
        run: dotnet test FileFlow.slnx -c Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx" --collect:"XPlat Code Coverage"

      - name: 🚧 Verificar umbral mínimo de cobertura
        shell: pwsh
        run: |
          $thresholdLine = 0.60
          $thresholdBranch = 0.44

          $coverageFile = Get-ChildItem -Path "FileFlow.Tests/TestResults" -Recurse -Filter "coverage.cobertura.xml" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $coverageFile) {
            throw "No se encontró coverage.cobertura.xml en FileFlow.Tests/TestResults"
          }

          [xml]$xml = Get-Content $coverageFile.FullName
          $lineRate = [double]$xml.coverage.'line-rate'
          $branchRate = [double]$xml.coverage.'branch-rate'

          Write-Host "Coverage file: $($coverageFile.FullName)"
          Write-Host ("Line rate: {0:P2}" -f $lineRate)
          Write-Host ("Branch rate: {0:P2}" -f $branchRate)

          if ($lineRate -lt $thresholdLine) {
            throw ("Cobertura de líneas insuficiente: {0:P2} < {1:P2}" -f $lineRate, $thresholdLine)
          }

          if ($branchRate -lt $thresholdBranch) {
            throw ("Cobertura de ramas insuficiente: {0:P2} < {1:P2}" -f $branchRate, $thresholdBranch)
          }

      - name: 📊 Publicar resultados de pruebas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-trx
          path: '**/TestResults/*.trx'
          retention-days: 7

      - name: 📈 Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-cobertura
          path: '**/TestResults/**/coverage.cobertura.xml'
          retention-days: 7

  # -------------------------------------------------------------------------
  # 2. Verificación de Compilación y Empaquetado en Linux
  # -------------------------------------------------------------------------
  build-linux-validation:
    name: 🐧 Validar Compilación y Empaquetado Linux
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 🛠️ Instalar herramientas de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file curl wget tar dpkg

      - name: 🏗️ Validar generación de instaladores de Linux
        shell: pwsh
        run: |
          .\installer\build-linux-installer.ps1 -Version "1.0.0-ci" -Configuration "Release"
