name: Build, Package & Release Multiplatform Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del lanzamiento (dejar vacío para auto-detectar de version.props + .build_number)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Marcar como pre-lanzamiento (Pre-release)'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Crear como borrador (Draft)'
        required: false
        default: false
        type: boolean
      run_tests:
        description: 'Ejecutar suite completa de pruebas antes de empaquetar'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # -------------------------------------------------------------------------
  # 1. Job para Resolver y Sanitizar la Versión
  # -------------------------------------------------------------------------
  resolve-version:
    name: 🏷️ Resolver Versión
    runs-on: ubuntu-latest
    outputs:
      clean_version: ${{ steps.get_version.outputs.clean_version }}
      tag_version: ${{ steps.get_version.outputs.tag_version }}
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Determinar y Sanitizar Versión
        id: get_version
        shell: pwsh
        run: |
          $rawVersion = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($rawVersion) -or $rawVersion -eq "main" -or $rawVersion -eq "master") {
            if ("${{ github.ref_type }}" -eq "tag" -and -not [string]::IsNullOrWhiteSpace("${{ github.ref_name }}")) {
              $rawVersion = "${{ github.ref_name }}"
            }
          }

          if ([string]::IsNullOrWhiteSpace($rawVersion) -or $rawVersion -eq "main" -or $rawVersion -eq "master") {
            Write-Host "==> Auto-detectando versión desde version.props y .build_number..." -ForegroundColor Cyan
            
            $maj = "1"
            $min = "0"
            $pat = "0"
            $pre = ""
            if (Test-Path "version.props") {
              [xml]$vProps = Get-Content "version.props"
              $maj = $vProps.Project.PropertyGroup.VersionMajor.Trim()
              $min = $vProps.Project.PropertyGroup.VersionMinor.Trim()
              $pat = $vProps.Project.PropertyGroup.VersionPatch.Trim()
              $preNode = $vProps.Project.PropertyGroup.VersionPreRelease
              if ($null -ne $preNode) { $pre = $preNode.Trim() } else { $pre = "" }
            }

            $buildNum = "100"
            if (Test-Path ".build_number") {
              $buildNum = (Get-Content ".build_number").Trim()
            }

            $preSuffix = if (-not [string]::IsNullOrWhiteSpace($pre)) { "-$pre" } else { "" }
            $rawVersion = "$maj.$min.$pat$preSuffix+build.$buildNum"
          }
          
          $sanitized = $rawVersion.Trim() -replace '\s+', '-' -replace '[^a-zA-Z0-9\.\+\-_]', '-'
          $cleanVersion = $sanitized.TrimStart('v')
          $tagVersion = "v$cleanVersion"

          Write-Host "Versión resuelta: $cleanVersion"
          Write-Host "Tag Git resuelto: $tagVersion"

          "clean_version=$cleanVersion" >> $env:GITHUB_OUTPUT
          "tag_version=$tagVersion" >> $env:GITHUB_OUTPUT

  # -------------------------------------------------------------------------
  # 2. Job de Compilación y Empaquetado para Windows (Inno Setup + Portable)
  # -------------------------------------------------------------------------
  build-windows:
    name: 🪟 Empaquetar para Windows
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restaurar dependencias
        run: dotnet restore FileFlow.slnx

      - name: 🧪 Ejecutar suite de pruebas
        if: ${{ github.event.inputs.run_tests != 'false' }}
        run: dotnet test FileFlow.slnx -c Release --no-restore --verbosity normal

      - name: 🛠️ Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $candidates = @(
            "C:\Program Files\Inno Setup 7",
            "C:\Program Files (x86)\Inno Setup 6",
            "C:\Program Files\Inno Setup 6"
          )
          foreach ($p in $candidates) {
            if (Test-Path (Join-Path $p "ISCC.exe")) {
              Write-Host "Añadiendo Inno Setup al PATH: $p"
              "$p" >> $env:GITHUB_PATH
              break
            }
          }

      - name: 🧹 Limpiar artefactos previos en el runner
        shell: pwsh
        run: |
          if (Test-Path "installer/output") {
            Remove-Item -Recurse -Force "installer/output" -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Path "installer/output" -Force | Out-Null

      - name: 🏗️ Compilar aplicación y generar instalador .exe
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.clean_version }}"
          Write-Host "Generando instalador de Windows para versión $ver..."
          .\installer\build-installer.ps1 -Version "$ver" -Runtime "win-x64" -SelfContained $true

      - name: 🗜️ Generar paquete portable autónomo .zip (reutilizando binarios ya compilados)
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.clean_version }}"
          Write-Host "Generando paquete portable autónomo para versión $ver..."
          .\installer\build-portable.ps1 -Version "$ver" -Runtime "win-x64" -SelfContained $true -SkipPublish

      - name: 🧹 Limpiar artefactos intermedios de compilación
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force FileFlow.App/bin/Release/net10.0/publish -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force FileFlow.App/bin/Release/net10.0-windows/publish -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force FileFlow.App/obj -ErrorAction SilentlyContinue

      - name: 📤 Subir artefactos de Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            installer/output/*.exe
            installer/output/*.zip
            installer/output/*.pdf
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # 3. Job de Compilación y Empaquetado para Linux (.deb, .AppImage, .tar.gz)
  # -------------------------------------------------------------------------
  build-linux:
    name: 🐧 Empaquetar para Linux (.deb, .AppImage, tarball)
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Optimizar espacio en disco del runner (Ubuntu)
        shell: bash
        run: |
          echo "==> Espacio en disco antes de optimización:"
          df -h /
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /opt/ghc 2>/dev/null || true
          sudo rm -rf /usr/local/.ghcup 2>/dev/null || true
          sudo rm -rf /usr/local/share/boost 2>/dev/null || true
          sudo docker system prune -af --volumes 2>/dev/null || true
          echo "==> Espacio en disco tras optimización:"
          df -h /

      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 🛠️ Instalar herramientas de empaquetado de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file curl wget tar dpkg-dev

      - name: 📦 Compilar y empaquetar distribuciones Linux
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.clean_version }}"
          Write-Host "Generando distribuciones de Linux para versión $ver..."
          .\installer\build-linux-installer.ps1 -Version "$ver" -Distro deb,appimage,tarball

      - name: 🧹 Limpiar temporales de compilación de Linux
        shell: bash
        run: |
          rm -rf FileFlow.App/bin FileFlow.App/obj 2>/dev/null || true

      - name: 📤 Subir artefactos de Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            installer/output/fileflow-linux-x64-*.tar.gz
            installer/output/*.deb
            installer/output/*.AppImage
          if-no-files-found: warn
          retention-days: 7

  # -------------------------------------------------------------------------
  # 4. Job de Compilación y Empaquetado para macOS (.app, .dmg, .zip)
  # -------------------------------------------------------------------------
  build-macos:
    name: 🍎 Empaquetar para macOS (.app, DMG, ZIP)
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 🍏 Compilar y empaquetar para Apple Silicon (arm64) e Intel (x64)
        shell: bash
        run: |
          VER="${{ needs.resolve-version.outputs.clean_version }}"
          chmod +x package-macos.sh
          echo "Empaquetando para macOS arm64..."
          ./package-macos.sh "$VER" arm64
          echo "Empaquetando para macOS x64..."
          ./package-macos.sh "$VER" x64

      - name: 🧹 Limpiar temporales de compilación de macOS
        shell: bash
        run: |
          rm -rf FileFlow.App/bin FileFlow.App/obj 2>/dev/null || true

      - name: 📤 Subir artefactos de macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # 5. Job de Compilación y Empaquetado para Web (WebAssembly)
  # -------------------------------------------------------------------------
  build-web:
    name: 🌐 Empaquetar para Web (WebAssembly)
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Optimizar espacio en disco del runner (Ubuntu)
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /opt/ghc 2>/dev/null || true
          sudo rm -rf /usr/local/.ghcup 2>/dev/null || true
          sudo rm -rf /usr/local/share/boost 2>/dev/null || true
          sudo docker system prune -af --volumes 2>/dev/null || true

      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 🌐 Compilar y empaquetar paquete estático WebAssembly
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.clean_version }}"
          Write-Host "Generando paquete WebAssembly para versión $ver..."
          .\installer\build-web.ps1 -Version "$ver"

      - name: 🧹 Limpiar temporales de compilación Web
        shell: bash
        run: |
          rm -rf FileFlow.Web/bin FileFlow.Web/obj 2>/dev/null || true

      - name: 📤 Subir artefactos de Web
        uses: actions/upload-artifact@v4
        with:
          name: web-packages
          path: installer/output/FileFlowStudio-Web-*.zip
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # 6. Job de Publicación Unificada en GitHub Releases
  # -------------------------------------------------------------------------
  publish-release:
    name: 🚀 Publicar GitHub Release Multiplataforma
    needs: [resolve-version, build-windows, build-linux, build-macos, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Optimizar espacio en disco del runner (Ubuntu)
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true
          sudo rm -rf /opt/ghc 2>/dev/null || true
          sudo rm -rf /usr/local/.ghcup 2>/dev/null || true
          sudo rm -rf /usr/local/share/boost 2>/dev/null || true
          sudo docker system prune -af --volumes 2>/dev/null || true

      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 📥 Descargar todos los artefactos de la compilación
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 🔐 Generar sumas de verificación SHA-256 unificadas
        shell: pwsh
        run: |
          $assetsDir = "release-assets"
          $checksumFile = "$assetsDir/checksums.txt"
          
          # Aplanar archivos si quedara alguna subcarpeta usando Move-Item (evita duplicar en disco)
          $subFiles = Get-ChildItem -Path $assetsDir -File -Recurse | Where-Object {
            $_.DirectoryName -ne (Resolve-Path $assetsDir).Path
          }
          foreach ($f in $subFiles) {
            $dest = Join-Path $assetsDir $f.Name
            Move-Item -Path $f.FullName -Destination $dest -Force
          }
          # Eliminar subcarpetas vacías
          Get-ChildItem -Path $assetsDir -Directory | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          # Purgar cualquier archivo intermedio que no sea para el usuario final
          Get-ChildItem -Path $assetsDir -File | Where-Object {
            $_.Name -like "*deb_tree.tar.gz" -or $_.Name -like "*.AppDir.tar.gz"
          } | Remove-Item -Force -ErrorAction SilentlyContinue

          # Seleccionar archivos para el checksum
          $filesToHash = Get-ChildItem -Path $assetsDir -File | Where-Object { 
            ($_.Extension -in @(".exe", ".zip", ".deb", ".AppImage", ".dmg", ".pdf") -or $_.Name -like "*.tar.gz") -and $_.Name -ne "checksums.txt"
          } | Sort-Object Name

          $checksums = foreach ($file in $filesToHash) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }

          $checksums | Out-File -FilePath $checksumFile -Encoding utf8
          Write-Host "=========================================================="
          Write-Host "Checksums SHA-256 generados para el lanzamiento:"
          Write-Host "=========================================================="
          Get-Content $checksumFile

      - name: 🚀 Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag_version }}
          target_commitish: ${{ github.sha }}
          name: FileFlow Studio ${{ needs.resolve-version.outputs.tag_version }}
          draft: ${{ github.event.inputs.draft == 'true' || false }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' || false }}
          generate_release_notes: true
          body: |
            ## ⚡ FileFlow Studio ${{ needs.resolve-version.outputs.tag_version }}

            Bienvenido a la versión **${{ needs.resolve-version.outputs.tag_version }}** de **FileFlow Studio**, la plataforma interactiva de automatización, inferencia de IA y procesamiento masivo de archivos basada en Grafos Dirigidos Acíclicos (DAG) para Windows, Linux, macOS y Web.

            ---

            ### 📦 Descargas Disponibles / Available Downloads

            #### 🪟 Windows (x64)
            - 💻 **Instalador Asistido / Setup Installer:** `FileFlowStudio-Setup-${{ needs.resolve-version.outputs.clean_version }}.exe`
              - *Asistente de instalación Inno Setup bilingüe (ES/EN) con manuales en PDF y accesos directos.*
            - 🗜️ **Versión Portable (.ZIP Autónomo):** `FileFlowStudio-Portable-v${{ needs.resolve-version.outputs.clean_version }}-win-x64.zip`
              - *Paquete portable sin instalación con manuales PDF y ejemplos de flujo.*

            #### 🐧 Linux (x86_64)
            - 📦 **Paquete Debian (.deb):** `fileflow_${{ needs.resolve-version.outputs.clean_version }}_amd64.deb`
              - *Instalable mediante `sudo dpkg -i fileflow...deb` o `sudo apt install ./fileflow...deb`.*
            - 🚀 **Ejecutable Único / Standalone AppImage:** `FileFlow-v${{ needs.resolve-version.outputs.clean_version }}-x86_64.AppImage`
              - *Formato de un solo archivo ejecutable compatible con distribuciones Linux (`chmod +x && ./FileFlow...AppImage`).*
            - 🌐 **Tarball Universal (.tar.gz):** `fileflow-linux-x64-v${{ needs.resolve-version.outputs.clean_version }}.tar.gz`
              - *Archivo universal con script de arranque `fileflow.sh` e integración de escritorio `.desktop`.*

            #### 🍎 macOS (Apple Silicon & Intel)
            - 🍏 **Apple Silicon (M1/M2/M3/M4):**
              - Imagen de disco: `FileFlowStudio-v${{ needs.resolve-version.outputs.clean_version }}-osx-arm64.dmg`
              - Archivo Comprimido: `FileFlowStudio-v${{ needs.resolve-version.outputs.clean_version }}-osx-arm64.zip`
            - 💻 **Intel (x64):**
              - Imagen de disco: `FileFlowStudio-v${{ needs.resolve-version.outputs.clean_version }}-osx-x64.dmg`
              - Archivo Comprimido: `FileFlowStudio-v${{ needs.resolve-version.outputs.clean_version }}-osx-x64.zip`

            #### 🌐 Web (WebAssembly / Navegador)
            - 🌐 **Paquete WebAssembly Estático:** `FileFlowStudio-Web-v${{ needs.resolve-version.outputs.clean_version }}.zip`
              - *Distribución estática precomprimida con Brotli lista para desplegar en Nginx, Apache, S3 o GitHub Pages.*

            #### 📚 Documentación y Manuales Oficiales (PDF)
            - 📖 `FileFlowStudio-Manual-de-Usuario.pdf` (Referencia técnica completa y catálogo de nodos)
            - 📖 `FileFlowStudio-Guia-Principiantes.pdf` (Guía paso a paso sin tecnicismos)
            - 📖 `FileFlowStudio-Manual-Scripting.pdf` (Manual de desarrollo de scripts en C# y JavaScript)
            - 📘 `FileFlowStudio-User-Manual.pdf` (Comprehensive technical reference & node catalog)
            - 📘 `FileFlowStudio-Beginners-Guide.pdf` (Step-by-step jargon-free automation guide)
            - 📘 `FileFlowStudio-Scripting-Manual.pdf` (C# & JavaScript custom scripting manual)

            #### 🔐 Sumas de Verificación / Checksums
            Consulte `checksums.txt` para verificar la integridad criptográfica SHA-256 de todos los binarios y documentos.

            ---

            ### 🌟 Características Destacadas de esta Versión
            - 🎨 **Lienzo DAG Interactivo:** Diseño de flujos mediante nodos visuales con validación topológica y prevención de ciclos en tiempo real.
            - 🤖 **Inferencia Local de IA:** Nodos integrados con modelos ONNX para clasificación de imágenes, OCR de alta precisión y modelos multimodales Vision-LLM.
            - ⚡ **Script Studio Integrado:** Motor dinámico dual C# (Roslyn JIT en memoria) y JavaScript (Jint Sandbox en .NET 10 LTS).
            - 🌐 **Soporte Multiplataforma Total:** Binarios optimizados para Windows, Linux (Debian, AppImage, Tarball), macOS (.app, DMG) y Web (WebAssembly).
            - 📋 **Reportes Visuales de Operaciones (`OperationReportNode`):** Generación de informes en **HTML Interactivo**, **Markdown**, **Árbol ASCII**, **JSON** y **CSV**.
            - ⚡ **Motor Asíncrono de Alto Rendimiento:** Procesamiento concurrente mediante `Channel<T>` con telemetría SQLite In-Memory (>82.000 logs/s).
            - 🛡️ **Inmutabilidad de Archivos de Origen y Simulación (*Dry Run*):** Procesamiento no destructivo por defecto y previsualización determinista.
          files: |
            release-assets/*.exe
            release-assets/*.zip
            release-assets/fileflow-linux-x64-*.tar.gz
            release-assets/*.deb
            release-assets/*.AppImage
            release-assets/*.dmg
            release-assets/*.pdf
            release-assets/checksums.txt
