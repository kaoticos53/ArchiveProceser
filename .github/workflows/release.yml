name: Build, Package & Release Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del lanzamiento (dejar vacío para auto-detectar de version.props + .build_number)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Marcar como pre-lanzamiento (Pre-release)'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Crear como borrador (Draft)'
        required: false
        default: false
        type: boolean
      run_tests:
        description: 'Ejecutar suite completa de pruebas antes de empaquetar'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-release:
    name: 🚀 Compilar, Empaquetar y Publicar Release
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 🏷️ Determinar y Sanitizar Versión de la Release
        id: get_version
        shell: pwsh
        run: |
          $rawVersion = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($rawVersion) -or $rawVersion -eq "main" -or $rawVersion -eq "master") {
            if ("${{ github.ref_type }}" -eq "tag" -and -not [string]::IsNullOrWhiteSpace("${{ github.ref_name }}")) {
              $rawVersion = "${{ github.ref_name }}"
            }
          }

          # Si no hay versión manual ni tag git específico, auto-detectar desde version.props y .build_number
          if ([string]::IsNullOrWhiteSpace($rawVersion) -or $rawVersion -eq "main" -or $rawVersion -eq "master") {
            Write-Host "==> Auto-detectando versión desde version.props y .build_number..." -ForegroundColor Cyan
            
            $maj = "1"
            $min = "0"
            $pat = "0"
            $pre = ""
            if (Test-Path "version.props") {
              [xml]$vProps = Get-Content "version.props"
              $maj = $vProps.Project.PropertyGroup.VersionMajor.Trim()
              $min = $vProps.Project.PropertyGroup.VersionMinor.Trim()
              $pat = $vProps.Project.PropertyGroup.VersionPatch.Trim()
              $preNode = $vProps.Project.PropertyGroup.VersionPreRelease
              if ($null -ne $preNode) { $pre = $preNode.Trim() } else { $pre = "" }
            }

            $buildNum = "100"
            if (Test-Path ".build_number") {
              $buildNum = (Get-Content ".build_number").Trim()
            }

            $preSuffix = if (-not [string]::IsNullOrWhiteSpace($pre)) { "-$pre" } else { "" }
            $rawVersion = "$maj.$min.$pat$preSuffix+build.$buildNum"
          }
          
          # Sanitizar: Eliminar espacios y caracteres ilegales en Git tags
          $sanitized = $rawVersion.Trim() -replace '\s+', '-' -replace '[^a-zA-Z0-9\.\+\-_]', '-'
          $cleanVersion = $sanitized.TrimStart('v')
          $tagVersion = "v$cleanVersion"

          Write-Host "Versión resuelta para instalador: $cleanVersion"
          Write-Host "Etiqueta Git para Release: $tagVersion"

          "clean_version=$cleanVersion" >> $env:GITHUB_OUTPUT
          "tag_version=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: 📦 Restaurar dependencias
        run: dotnet restore FileFlow.slnx

      - name: 🧪 Ejecutar suite de pruebas unitarias y de integración
        if: ${{ github.event.inputs.run_tests != 'false' }}
        run: dotnet test FileFlow.slnx -c Release --no-restore --verbosity normal

      - name: 🛠️ Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoPath) {
            Write-Host "Añadiendo Inno Setup al PATH: $innoPath"
            "$innoPath" >> $env:GITHUB_PATH
          }

      - name: 🏗️ Compilar aplicación y generar instalador .exe
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.clean_version }}"
          Write-Host "Generando instalador para versión $ver..."
          .\installer\build-installer.ps1 -Version "$ver" -Runtime "win-x64" -SelfContained $true

      - name: 🗜️ Generar paquete portable autónomo .zip
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.clean_version }}"
          Write-Host "Generando paquete portable autónomo para versión $ver..."
          .\installer\build-portable.ps1 -Version "$ver" -Runtime "win-x64" -SelfContained $true

      - name: 🔐 Generar sumas de verificación SHA-256
        shell: pwsh
        run: |
          $outputDir = "installer/output"
          $checksumFile = "$outputDir/checksums.txt"
          $files = Get-ChildItem -Path $outputDir -File | Where-Object { $_.Extension -in @(".exe", ".zip", ".pdf") }

          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }

          $checksums | Out-File -FilePath $checksumFile -Encoding utf8
          Write-Host "Checksums generados:"
          Get-Content $checksumFile

      - name: 📤 Subir artefactos de la compilación
        uses: actions/upload-artifact@v4
        with:
          name: FileFlowStudio-Packages-${{ steps.get_version.outputs.clean_version }}
          path: installer/output/*
          if-no-files-found: error
          retention-days: 14

      - name: 🚀 Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.tag_version }}
          target_commitish: ${{ github.sha }}
          name: FileFlow Studio ${{ steps.get_version.outputs.tag_version }}
          draft: ${{ github.event.inputs.draft == 'true' || false }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' || false }}
          generate_release_notes: true
          body: |
            ## ⚡ FileFlow Studio ${{ steps.get_version.outputs.tag_version }}

            Bienvenido a la versión **${{ steps.get_version.outputs.tag_version }}** de **FileFlow Studio**, el motor visual interactivo de automatización y procesamiento masivo de archivos basado en Grafos Dirigidos Acíclicos (DAG) para Windows.

            ---

            ### 📦 Descargas Disponibles
            - 💻 **Instalador para Windows (Recomendado):** `FileFlowStudio-Setup-${{ steps.get_version.outputs.clean_version }}.exe`
              - *Incluye asistente de instalación bilingüe (Español/Inglés), los 3 manuales en PDF, accesos directos en el menú de inicio e integración completa.*
            - 🗜️ **Versión Portable (.ZIP Autónomo):** `FileFlowStudio-Portable-v${{ steps.get_version.outputs.clean_version }}-win-x64.zip`
              - *Ejecución directa sin instalación ni permisos de administrador. Incluye marcador `portable.dat`, estructura preconfigurada `data/` (config, presets, themes, scripts, logs, tools) y subcarpeta `docs/` con manuales en PDF.*
            - 📖 **Manual de Usuario y Referencia (PDF):** `FileFlowStudio-Manual-de-Usuario.pdf`
              - *Documento PDF oficial con referencia técnica completa y catálogo exhaustivo de nodos.*
            - 📘 **Guía Rápida para Principiantes (PDF):** `FileFlowStudio-Guia-Principiantes.pdf`
              - *Manual didáctico paso a paso con analogías sencillas y recetas prácticas.*
            - 💻 **Manual de Scripting Personalizado (PDF):** `FileFlowStudio-Manual-Scripting.pdf`
              - *Guía técnica para el desarrollo de scripts en C# (Roslyn) y JavaScript (Jint).*
            - 🔐 **Sumas de Verificación:** Consulte `checksums.txt` para verificar la integridad criptográfica SHA-256 de todos los binarios y documentos.

            ---

            ### 🌟 Características Destacadas de esta Versión
            - 🎨 **Lienzo DAG Interactivo:** Diseño de flujos mediante nodos visuales con validación topológica y prevención de ciclos en tiempo real.
            - ⚡ **Script Studio Integrado:** Nodo de scripting dinámico con motor dual C# (Roslyn JIT en memoria) y JavaScript (Jint Sandbox en .NET 9).
            - 💾 **Soporte Nativo de Modo Portable (`AppPaths`):** Aislamiento de datos en la carpeta `data/` local al ejecutable sin alterar `%AppData%` ni el registro.
            - 🌐 **Localización Dinámica 100% (i18n):** Cambio de idioma instantáneo en caliente entre Español e Inglés sin reiniciar la app.
            - 📋 **Reportes Visuales de Operaciones (`OperationReportNode`):** Generación de informes en **HTML Interactivo**, **Markdown**, **Árbol ASCII**, **JSON** y **CSV**.
            - ⚡ **Motor Asíncrono de Alto Rendimiento:** Procesamiento concurrente mediante `Channel<T>` con telemetría SQLite In-Memory (>82.000 logs/s).
            - 🛡️ **Inmutabilidad de Archivos de Origen y Simulación (*Dry Run*):** Procesamiento no destructivo por defecto y previsualización determinista.
          files: |
            installer/output/*.exe
            installer/output/*.zip
            installer/output/*.pdf
            installer/output/checksums.txt
