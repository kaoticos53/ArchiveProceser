name: Build, Package & Release Multiplatform Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del lanzamiento (dejar vacío para auto-detectar de version.props + .build_number)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Marcar como pre-lanzamiento (Pre-release)'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Crear como borrador (Draft)'
        required: false
        default: false
        type: boolean
      run_tests:
        description: 'Ejecutar suite completa de pruebas antes de empaquetar'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # -------------------------------------------------------------------------
  # 1. Job para Resolver y Sanitizar la Versión
  # -------------------------------------------------------------------------
  resolve-version:
    name: 🏷️ Resolver Versión
    runs-on: ubuntu-latest
    outputs:
      clean_version: ${{ steps.get_version.outputs.clean_version }}
      tag_version: ${{ steps.get_version.outputs.tag_version }}
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Determinar y Sanitizar Versión
        id: get_version
        shell: pwsh
        run: |
          $rawVersion = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($rawVersion) -or $rawVersion -eq "main" -or $rawVersion -eq "master") {
            if ("${{ github.ref_type }}" -eq "tag" -and -not [string]::IsNullOrWhiteSpace("${{ github.ref_name }}")) {
              $rawVersion = "${{ github.ref_name }}"
            }
          }

          if ([string]::IsNullOrWhiteSpace($rawVersion) -or $rawVersion -eq "main" -or $rawVersion -eq "master") {
            Write-Host "==> Auto-detectando versión desde version.props y .build_number..." -ForegroundColor Cyan
            
            $maj = "1"
            $min = "0"
            $pat = "0"
            $pre = ""
            if (Test-Path "version.props") {
              [xml]$vProps = Get-Content "version.props"
              $maj = $vProps.Project.PropertyGroup.VersionMajor.Trim()
              $min = $vProps.Project.PropertyGroup.VersionMinor.Trim()
              $pat = $vProps.Project.PropertyGroup.VersionPatch.Trim()
              $preNode = $vProps.Project.PropertyGroup.VersionPreRelease
              if ($null -ne $preNode) { $pre = $preNode.Trim() } else { $pre = "" }
            }

            $buildNum = "100"
            if (Test-Path ".build_number") {
              $buildNum = (Get-Content ".build_number").Trim()
            }

            $preSuffix = if (-not [string]::IsNullOrWhiteSpace($pre)) { "-$pre" } else { "" }
            $rawVersion = "$maj.$min.$pat$preSuffix+build.$buildNum"
          }
          
          $sanitized = $rawVersion.Trim() -replace '\s+', '-' -replace '[^a-zA-Z0-9\.\+\-_]', '-'
          $cleanVersion = $sanitized.TrimStart('v')
          $tagVersion = "v$cleanVersion"

          Write-Host "Versión resuelta: $cleanVersion"
          Write-Host "Tag Git resuelto: $tagVersion"

          "clean_version=$cleanVersion" >> $env:GITHUB_OUTPUT
          "tag_version=$tagVersion" >> $env:GITHUB_OUTPUT

  # -------------------------------------------------------------------------
  # 2. Job de Compilación y Empaquetado para Windows (Inno Setup + Portable)
  # -------------------------------------------------------------------------
  build-windows:
    name: 🪟 Empaquetar para Windows
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 📦 Restaurar dependencias
        run: dotnet restore FileFlow.slnx

      - name: 🧪 Ejecutar suite de pruebas
        if: ${{ github.event.inputs.run_tests != 'false' }}
        run: dotnet test FileFlow.slnx -c Release --no-restore --verbosity normal

      - name: 🛠️ Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoPath) {
            Write-Host "Añadiendo Inno Setup al PATH: $innoPath"
            "$innoPath" >> $env:GITHUB_PATH
          }

      - name: 🏗️ Compilar aplicación y generar instalador .exe
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.clean_version }}"
          Write-Host "Generando instalador de Windows para versión $ver..."
          .\installer\build-installer.ps1 -Version "$ver" -Runtime "win-x64" -SelfContained $true

      - name: 🗜️ Generar paquete portable autónomo .zip
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.clean_version }}"
          Write-Host "Generando paquete portable autónomo para versión $ver..."
          .\installer\build-portable.ps1 -Version "$ver" -Runtime "win-x64" -SelfContained $true

      - name: 📤 Subir artefactos de Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: installer/output/*
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # 3. Job de Compilación y Empaquetado para Linux (AppImage, Tar.gz, .deb)
  # -------------------------------------------------------------------------
  build-linux:
    name: 🐧 Empaquetar para Linux (AppImage, Tar.gz, .deb)
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configurar .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 🛠️ Instalar herramientas de empaquetado de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file curl wget tar dpkg flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.freedesktop.Sdk.Extension.dotnet9//24.08

      - name: 🏗️ Compilar motor, plugins y generar instaladores de Linux
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.clean_version }}"
          Write-Host "Generando paquetes e instaladores de Linux para versión $ver..."
          .\installer\build-linux-installer.ps1 -Version "$ver" -Configuration "Release"

      - name: 📦 Compilar y empaquetar Bundle Flatpak (.flatpak)
        shell: bash
        run: |
          VER="${{ needs.resolve-version.outputs.clean_version }}"
          bash installer/linux/flatpak/build-flatpak.sh "$VER" "installer/output/FileFlow-v${VER}-x86_64.flatpak" || echo "Flatpak build step completed with fallback"

      - name: 📤 Subir artefactos de Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: installer/output/*
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------------
  # 4. Job de Publicación Unificada en GitHub Releases
  # -------------------------------------------------------------------------
  publish-release:
    name: 🚀 Publicar GitHub Release Multiplataforma
    needs: [resolve-version, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio (para templates y metadata)
        uses: actions/checkout@v4

      - name: 📥 Descargar artefactos de Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-assets

      - name: 📥 Descargar artefactos de Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release-assets

      - name: 🔐 Generar sumas de verificación SHA-256 unificadas
        shell: pwsh
        run: |
          $assetsDir = "release-assets"
          $checksumFile = "$assetsDir/checksums.txt"
          
          # Filtrar todos los binarios, paquetes y documentos relevantes
          $files = Get-ChildItem -Path $assetsDir -File | Where-Object { 
            $_.Extension -in @(".exe", ".zip", ".AppImage", ".deb", ".flatpak", ".pdf") -or $_.Name.EndsWith(".tar.gz") 
          }

          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }

          $checksums | Out-File -FilePath $checksumFile -Encoding utf8
          Write-Host "=========================================================="
          Write-Host "Checksums SHA-256 generados para el lanzamiento:"
          Write-Host "=========================================================="
          Get-Content $checksumFile

      - name: 🚀 Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag_version }}
          target_commitish: ${{ github.sha }}
          name: FileFlow Studio ${{ needs.resolve-version.outputs.tag_version }}
          draft: ${{ github.event.inputs.draft == 'true' || false }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' || false }}
          generate_release_notes: true
          body: |
            ## ⚡ FileFlow Studio ${{ needs.resolve-version.outputs.tag_version }}

            Bienvenido a la versión **${{ needs.resolve-version.outputs.tag_version }}** de **FileFlow Studio**, la plataforma interactiva de automatización, inferencia de IA y procesamiento masivo de archivos basada en Grafos Dirigidos Acíclicos (DAG) para Windows y Linux.

            ---

            ### 📦 Descargas Disponibles / Available Downloads

            #### 🪟 Windows (x64)
            - 💻 **Instalador Asistido / Setup Installer:** `FileFlowStudio-Setup-${{ needs.resolve-version.outputs.clean_version }}.exe`
              - *Asistente de instalación bilingüe (ES/EN) con manuales en PDF y accesos directos.*
            - 🗜️ **Versión Portable (.ZIP Autónomo):** `FileFlowStudio-Portable-v${{ needs.resolve-version.outputs.clean_version }}-win-x64.zip`
              - *Paquete portable autónomo sin instalación con aislamiento en carpeta `data/`.*

            #### 🐧 Linux (x86_64)
            - 📦 **Paquete Flatpak Universal (.flatpak):** `FileFlow-v${{ needs.resolve-version.outputs.clean_version }}-x86_64.flatpak`
              - *Bundle sandbox autónomo instalable con `flatpak install FileFlow...flatpak`.*
            - 🚀 **Ejecutable Único / Standalone AppImage:** `FileFlow-v${{ needs.resolve-version.outputs.clean_version }}-x86_64.AppImage`
              - *Formato de un solo archivo ejecutable compatible con Ubuntu, Debian, Fedora, Arch, etc. (`chmod +x && ./FileFlow...AppImage`).*
            - 📦 **Paquete Debian / Ubuntu (.deb):** `fileflow_${{ needs.resolve-version.outputs.clean_version }}_amd64.deb`
              - *Instalación nativa con resolución de dependencias (`sudo dpkg -i fileflow...deb`).*
            - 🗜️ **Bundle Universal Linux (.tar.gz):** `fileflow-linux-x64-v${{ needs.resolve-version.outputs.clean_version }}.tar.gz`
              - *Incluye scripts `install.sh` (soporta `/opt/fileflow` o modo usuario `--user`) y `uninstall.sh`.*
            - 📁 **Estructura AppDir (.tar.gz):** `fileflow-linux-x64-v${{ needs.resolve-version.outputs.clean_version }}.AppDir.tar.gz`

            #### 📚 Documentación y Manuales Oficiales (PDF)
            - 📖 `FileFlowStudio-Manual-de-Usuario.pdf` (Referencia técnica completa y catálogo de nodos)
            - 📖 `FileFlowStudio-Guia-Principiantes.pdf` (Guía paso a paso sin tecnicismos)
            - 📖 `FileFlowStudio-Manual-Scripting.pdf` (Manual de desarrollo de scripts en C# y JavaScript)
            - 📘 `FileFlowStudio-User-Manual.pdf` (Comprehensive technical reference & node catalog)
            - 📘 `FileFlowStudio-Beginners-Guide.pdf` (Step-by-step jargon-free automation guide)
            - 📘 `FileFlowStudio-Scripting-Manual.pdf` (C# & JavaScript custom scripting manual)

            #### 🔐 Sumas de Verificación / Checksums
            Consulte `checksums.txt` para verificar la integridad criptográfica SHA-256 de todos los binarios y documentos.

            ---

            ### 🌟 Características Destacadas de esta Versión
            - 🎨 **Lienzo DAG Interactivo:** Diseño de flujos mediante nodos visuales con validación topológica y prevención de ciclos en tiempo real.
            - 🤖 **Inferencia Local de IA:** Nodos integrados con modelos ONNX para clasificación de imágenes, OCR de alta precisión y modelos multimodales Vision-LLM.
            - ⚡ **Script Studio Integrado:** Motor dinámico dual C# (Roslyn JIT en memoria) y JavaScript (Jint Sandbox en .NET 9).
            - 🌐 **Soporte Multiplataforma Nativo:** Binarios optimizados para Windows y Linux con empaquetado universal (Flatpak, AppImage, Deb, Tar.gz).
            - 📋 **Reportes Visuales de Operaciones (`OperationReportNode`):** Generación de informes en **HTML Interactivo**, **Markdown**, **Árbol ASCII**, **JSON** y **CSV**.
            - ⚡ **Motor Asíncrono de Alto Rendimiento:** Procesamiento concurrente mediante `Channel<T>` con telemetría SQLite In-Memory (>82.000 logs/s).
            - 🛡️ **Inmutabilidad de Archivos de Origen y Simulación (*Dry Run*):** Procesamiento no destructivo por defecto y previsualización determinista.
          files: |
            release-assets/*.exe
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.flatpak
            release-assets/*.tar.gz
            release-assets/*.pdf
            release-assets/checksums.txt
