app-id: com.fileflowstudio.FileFlow
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet9
command: fileflow

finish-args:
  # Interfaz gráfica Avalonia UI (X11, Wayland e IPC)
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

  # Aceleración por GPU (Renderizado Skia / OpenGL / Vulkan)
  - --device=dri

  # Acceso al sistema de archivos para procesamiento de flujos
  - --filesystem=host
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

  # Conectividad de red para nodos de descarga, LLM e integraciones
  - --share=network

  # Notificaciones del sistema
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: fileflow
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/dotnet9/bin
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
        DOTNET_NOLOGO: 'true'
    build-commands:
      # Compilación de la aplicación Avalonia en modo Release autocontenido
      - dotnet publish FileFlow.App/FileFlow.App.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o /app/lib/fileflow
      
      # Creación de lanzador en /app/bin
      - mkdir -p /app/bin
      - ln -sf /app/lib/fileflow/FileFlow.App /app/bin/fileflow
      - chmod +x /app/bin/fileflow /app/lib/fileflow/FileFlow.App
      
      # Instalación de metadatos de escritorio, icono y metainfo AppStream
      - install -Dm644 installer/linux/flatpak/com.fileflowstudio.FileFlow.desktop /app/share/applications/com.fileflowstudio.FileFlow.desktop
      - install -Dm644 assets/FileFlow.png /app/share/icons/hicolor/256x256/apps/com.fileflowstudio.FileFlow.png
      - install -Dm644 installer/linux/flatpak/com.fileflowstudio.FileFlow.metainfo.xml /app/share/metainfo/com.fileflowstudio.FileFlow.metainfo.xml
    sources:
      - type: dir
        path: ../../../
